# Nginx do container do painel web (ver Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (main-ABC123.js): podem ficar em cache "para sempre"
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache: depois de um deploy o navegador pega a versão nova na hora
    location / {
        add_header Cache-Control "no-cache";
        # rota do Angular (/rotas/12, /encomendas...) não é arquivo: devolve o index.html e o router resolve
        try_files $uri $uri/ /index.html;
    }
}
